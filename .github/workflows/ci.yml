name: CI — NYC Taxi Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate sample data
        run: python3 data/generate_sample.py

      - name: Run unit tests
        run: python3 -m pytest tests/ -q --tb=short

      - name: Run ingestion stage
        run: python3 src/ingestion.py

      - name: Run transformations stage
        run: python3 src/transformations.py

      - name: Run streaming stage
        run: python3 src/streaming.py

      - name: Run ML pipeline stage
        run: python3 src/ml_pipeline.py

      - name: Run EDA stage
        run: python3 src/eda.py

      - name: Verify outputs exist
        run: |
          test -f data/outputs/ml_metrics.json
          test -d data/outputs/demand_by_hour
          test -d data/outputs/top_pickup_zones
          test -d data/outputs/streaming_hourly_summary
          test -f docs/figures/trips_by_hour.png
          echo "All outputs verified ✓"
